backend:
  name: git-gateway
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: robots
    label: "Our Robots"
    folder: "src/content/robots"
    create: true
    slug: "{{year}}"
    fields:
      - { label: "Season Year", name: "year", widget: "number", value_type: "int" }
      - { label: "Robot Name", name: "name", widget: "string" }
      - { label: "Photo", name: "photo", widget: "image" }
      - label: "Spec Bullets (1-5)"
        name: "bullets"
        widget: "list"
        field: { label: "Bullet", name: "bullet", widget: "string" }
        min: 1
        max: 5

  - name: leadership
    label: "Student Leaders"
    label_singular: "Student Leader"
    folder: "src/content/leadership"
    create: true
    slug: "{{fields.name}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Role", name: "role", widget: "string" }
      - { label: "Sub-team", name: "subteam", widget: "string" }

  - name: mentors
    label: "Mentors"
    label_singular: "Mentor"
    folder: "src/content/mentors"
    create: true
    slug: "{{fields.name}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Role", name: "role", widget: "string" }
      - { label: "Sub-team", name: "subteam", widget: "string" }

  - name: sponsors
    label: "Sponsors"
    folder: "src/content/sponsors"
    create: true
    slug: "{{fields.name}}"
    fields:
      - { label: "Sponsor Name", name: "name", widget: "string" }
      - { label: "Logo", name: "logo", widget: "image" }
      # Optional, but if filled it must be a full absolute URL: the Zod schema
      # in src/content.config.ts runs .url(), so a bare domain like
      # "buzzers.com" would save cleanly here and then fail the Netlify build.
      # Validating in the CMS puts the error in front of the editor instead.
      # The ^$ alternative keeps an intentionally blank field valid.
      - label: "Website Link"
        name: "link"
        widget: "string"
        required: false
        hint: "Full URL including https:// — or leave blank if the sponsor has no site."
        pattern:
          - '^$|^https?://[a-zA-Z0-9][a-zA-Z0-9-]*(\.[a-zA-Z0-9][a-zA-Z0-9-]*)+(:[0-9]{1,5})?([/?#][^\s]*)?$'
          - "Must be a full URL starting with https:// (for example https://example.com), or left blank"

  - name: pages
    label: "Page Content"
    files:
      - label: "About Us & FIRST"
        name: "about"
        file: "src/content/pages/about.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
      - label: "Outreach & Impact"
        name: "outreach"
        file: "src/content/pages/outreach.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
